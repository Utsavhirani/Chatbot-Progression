# AI Business Assistant: full stack.
#
#   docker compose up -d --build     build and start everything (UI: http://localhost:8080)
#   docker compose ps                status and health
#   docker compose logs -f api       follow backend logs
#   docker compose exec api python -m app.doctor --live    self-check
#   docker compose stop              stop (data is kept)
#   docker compose down -v           remove everything INCLUDING the database volume
#
# Development without the app containers: `docker compose up -d db` and run backend/frontend locally.
# Configuration comes from .env (copy .env.example, or run scripts/setup.sh / scripts/setup.ps1).
# `restart: unless-stopped` brings the app back automatically whenever Docker starts.

name: ai-assistant

x-db-url: &db-url postgresql+asyncpg://${POSTGRES_USER:-assistant}:${POSTGRES_PASSWORD:-assistant_dev_pw}@db:5432/assistant

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistant_dev_pw}
      POSTGRES_DB: assistant
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"   # localhost only: for local dev and tests
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    image: ai-assistant-api:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Container-specific values override .env (which targets local development).
      DATABASE_URL: *db-url
      ENV: prod
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # true once served over HTTPS
      PROVIDER: ${PROVIDER:-groq}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"   # reachable only by the web container
    stop_grace_period: 20s   # let in-flight replies finish and be saved

  web:
    build: ./frontend
    image: ai-assistant-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
